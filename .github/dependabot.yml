# Group routine dependency updates for weekly review.

version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the `root` directory
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Singapore"
    # Only routine version updates are grouped; major upgrades stay separate.
    # Specific families come first because the first matching group wins.
    groups:
      ai-sdk:
        applies-to: "version-updates"
        patterns: ["ai", "@ai-sdk/*"]
        update-types: ["minor", "patch"]
      react-next:
        applies-to: "version-updates"
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      runtime-dependencies:
        applies-to: "version-updates"
        dependency-type: "production"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      development-tools:
        applies-to: "version-updates"
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Review TypeScript major upgrades with the lint toolchain.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Review AI SDK core and provider major upgrades together.
      - dependency-name: "ai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@ai-sdk/*"
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`
    # You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns: ["*"]
        update-types: ["minor", "patch"]
